server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/UniCarDB
spring.datasource.username=usuario
spring.datasource.password=usuario
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#Validacion
spring.jpa.hibernate.ddl-auto=update
# El log de SQL es caro: solo se activa con SHOW_SQL=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}

# El secreto NO se versiona: se define con la variable de entorno JWT_SECRET (>= 32 bytes).
# Si no se define, la aplicacion genera una clave aleatoria temporal en cada arranque.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Fotos de perfil: se guardan como archivos, no en la base de datos
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Login con Google (el Client ID es publico; se puede sobreescribir con GOOGLE_CLIENT_ID)
google.client-id=${GOOGLE_CLIENT_ID:709903947896-cdljfjojn0tvs70hkcg0be5gn2igem3i.apps.googleusercontent.com}


#Log de la terminal organizado:

#Nombre y ubicacion de los logs
logging.file.name=logs/unicar.log

#Tama o maximo del log:
logging.logback.rollingpolicy.max-file-size=10MB

#Dias de historial guardados:
logging.logback.rollingpolicy.max-history=7

#Maximo total de archivos de log combinados
logging.logback.rollingpolicy.total-size-cap=100MB

#Codigo de los logs
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
# Pool de conexiones (Hikari) dimensionado para 1-2 vCPU; max-lifetime < wait_timeout de MySQL (8 h por defecto)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

# Tomcat
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=30000

# Compresion de respuestas JSON
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# Actuator: solo health e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- Rendimiento de Hibernate ---
# Carga por lotes de colecciones y relaciones perezosas (evita N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# La conexion no se retiene mientras se serializa la respuesta: todo el acceso a datos ocurre en los servicios
spring.jpa.open-in-view=false
